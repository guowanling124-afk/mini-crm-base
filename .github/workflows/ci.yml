# =============================================================================
# ci.yml  —  SAFE BASELINE  (reference for Task C: cache, and general hygiene)
# -----------------------------------------------------------------------------
# This is how a careful team writes CI. Study it as the "secure" side of your
# comparisons:
#   * trigger is `pull_request` (NOT pull_request_target) -> fork code runs
#     WITHOUT the base repo's secrets. This is the safe choice.
#   * `permissions:` is read-only by default.
#   * Maven dependency cache (~/.m2) is populated by setup-java's `cache: maven`.
#     That cache is the write surface Task C investigates: who can write to it,
#     and from which trigger.
# Nothing here is intended to be vulnerable. The vulnerable counterpart lives in
# lab-c-cache-poison.yml.
# =============================================================================
name: ✅ CI

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-and-test:
        name: 🔨 Build & Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven          # <-- populates & restores the ~/.m2 cache (Task C surface)

            - name: 🔎 Run unit tests
              run: mvn -B test

            - name: 🔨 Package
              run: mvn -B -DskipTests package

            - name: 📤 Upload jar artifact
              uses: actions/upload-artifact@v4
              with:
                  name: mini-crm-jar
                  path: target/*.jar
                  retention-days: 5

    lint:
        name: 🔬 Format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven

            # Placeholder for a real formatter (spotless/checkstyle). Kept as a
            # no-op so the workflow graph looks like a real project's.
            - name: 🔬 Verify compiles
              run: mvn -B -DskipTests compile
