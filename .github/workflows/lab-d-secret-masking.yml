# =============================================================================
# lab-d-secret-masking.yml  —  TEST FIXTURE (uses only a CANARY secret)
# -----------------------------------------------------------------------------
# TASK D — secret log-masking bypass.
#
# WHAT THIS DEMONSTRATES
#   GitHub auto-masks a secret's exact value in logs. This fixture echoes a
#   CANARY secret (FAKE_SECRET=canary123) after various transformations to see
#   which ones defeat masking and surface the value in plaintext. Because the
#   runner only masks the literal bytes of the secret, transformations like
#   base64, reversing, per-character spacing, or splitting across lines may slip
#   through.
#
# FRAMING  (keep it honest — aligns with "don't exaggerate" in the rubric)
#   * Use ONLY the canary value. Never a real secret.
#   * A finding here is a "masking bypass", NOT a real credential leak.
#   * GitHub's scope says bypasses via NON-STANDARD encodings are ineligible.
#     So concentrate on STANDARD encodings the platform claims to handle, and
#     note in the report which side of that line each case sits on.
#
# HOW TO TRIGGER (your own test repo)
#   Set repo secret FAKE_SECRET=canary123, then run this workflow manually.
# =============================================================================
name: "LAB-D secret-masking probes (canary only)"

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    masking-probes:
        runs-on: ubuntu-latest
        env:
            FAKE_SECRET: ${{ secrets.FAKE_SECRET }}   # MUST be a canary, e.g. canary123
        steps:
            - name: Plain echo (expected: masked)
              run: echo "plain=$FAKE_SECRET"

            - name: Base64 (standard encoding — does masking catch it?)
              run: echo "b64=$(printf '%s' "$FAKE_SECRET" | base64)"

            - name: Reversed
              run: echo "rev=$(printf '%s' "$FAKE_SECRET" | rev)"

            - name: Per-character spacing
              run: echo "spaced=$(printf '%s' "$FAKE_SECRET" | sed 's/./& /g')"

            - name: Split across lines
              run: |
                  echo "part1=${FAKE_SECRET:0:4}"
                  echo "part2=${FAKE_SECRET:4}"

            - name: Hex
              run: echo "hex=$(printf '%s' "$FAKE_SECRET" | xxd -p)"
